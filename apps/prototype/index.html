<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Paradox — Sample Feed</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307070c'/%3E%3Cpath d='M9 23V12.5M9 12.5C13 12.5 14.5 7 17 7M9 12.5C13.5 12.5 16 17 22.5 17' stroke='%23a598ff' stroke-width='1.7' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='23' r='2.1' fill='%23a598ff'/%3E%3Ccircle cx='17' cy='7' r='1.7' fill='none' stroke='%23a598ff' stroke-width='1.6'/%3E%3Ccircle cx='22.5' cy='17' r='1.7' fill='none' stroke='%23a598ff' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <div class="shell">
      <header id="topbar" class="topbar"></header>
      <nav id="sidebar" class="sidebar" aria-label="Primary"></nav>
      <main id="stage" class="stage">
        <p class="boot">Loading Paradox…</p>
      </main>
      <aside id="inspector" class="inspector" aria-label="Timeline inspector"></aside>
      <div
        id="preview-resizer"
        class="preview-resizer"
        role="separator"
        aria-orientation="horizontal"
        aria-label="Resize live preview"
        aria-valuemin="160"
        aria-valuemax="640"
        tabindex="0"
      ></div>
      <section id="preview" class="preview" aria-label="Live application"></section>
    </div>
    <div id="toasts" class="toasts" aria-live="polite" aria-relevant="additions"></div>
    <div id="overlays"></div>
    <div id="sr-status" class="sr-only" aria-live="polite"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
