<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paradox</title>
  <style>
    body {
      margin: 0;
      background: #09090e;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    header {
      padding: 24px 32px;
      border-bottom: 1px solid #292933;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    main { padding: 48px 32px; }
    h1 { font-size: 48px; letter-spacing: -2px; }
    p { color: #a1a1aa; }
    button {
      padding: 12px 20px;
      background: #7258f5;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <strong>◈ PARADOX</strong>
    <span>Software, across timelines.</span>
  </header>
  <main>
    <h1>Explore what your software could become.</h1>
    <p>Generate, navigate, compare, and promote alternate futures.</p>
    <button onclick="alert('Timeline creation coming next')">
      Create a future →
    </button>
  </main>
</body>
</html>
